
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-report-automation"
version = "1.0.0"
description = "Automated weather PDF report generator"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "reportlab",
    "matplotlib",
    "schedule"
]

[project.scripts]
weather-report = "weather_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
